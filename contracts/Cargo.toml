[workspace]
resolver = "2"
members = ["showcase"]

[workspace.dependencies]
soroban-sdk = "25"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release but keeps debug assertions and logs, for diagnosing a
# contract's behaviour on a test network.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# ---------------------------------------------------------------------------
# Rust / Soroban contract contribution guide
# ---------------------------------------------------------------------------
#
# This workspace holds every Soroban contract that ships with the project.
# The notes below are the contract-specific companion to CONTRIBUTING.md.
#
# Toolchain
#   - Install Rust via https://rustup.rs and add the wasm target:
#       rustup target add wasm32v1-none
#   - Install the Stellar CLI (used to build/deploy contracts):
#       cargo install --locked stellar-cli
#   - Soroban SDK docs: https://developers.stellar.org/docs/build/smart-contracts/overview
#   - Stellar SDK / Soroban reference: https://soroban.stellar.org/docs
#
# Build
#   cargo build --workspace --target wasm32v1-none --release
#   # or, per contract, via the Stellar CLI:
#   stellar contract build
#
# Test
#   cargo test --workspace
#   # run a single contract's tests:
#   cargo test -p <crate-name>
#
# Format
#   cargo fmt --all
#   cargo fmt --all -- --check   # CI check
#
# Lint (clippy)
#   cargo clippy --workspace --all-targets -- -D warnings
#
# Adding a new contract to contracts/
#   1. Create the crate: `cargo new --lib contracts/<name>` (or copy an
#      existing crate such as `showcase` as a starting point).
#   2. In the new crate's Cargo.toml set `crate-type = ["cdylib", "rlib"]`
#      and depend on the workspace SDK: `soroban-sdk = { workspace = true }`.
#   3. Register the crate in the `members` list of this workspace file.
#   4. Implement the contract in `src/lib.rs` with `#[contract]` /
#      `#[contractimpl]`, and add unit tests under `#[cfg(test)]` using
#      `soroban_sdk::Env`.
#   5. Add test snapshots (generated by `cargo test`) under `test_snapshots/`
#      and commit them alongside the contract.
#   6. Run `cargo fmt --all`, `cargo clippy --workspace --all-targets -- -D warnings`
#      and `cargo test --workspace` before opening a PR.
#
# See CONTRIBUTING.md for the full contribution workflow.
